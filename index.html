<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>関数電卓</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a6df4">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f4f4f2;--fg:#1c1c1a;--card:#fff;--mut:#777;--acc:#2a6df4;--btn:#e8e8e4;--op:#d9e4ff;--jp:#ffe9c9;--un:#dcf3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16161a;--fg:#ececea;--card:#222228;--mut:#999;--acc:#6c9bff;--btn:#33333a;--op:#2b3a63;--jp:#5a4020;--un:#24462f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16161a;--fg:#ececea;--card:#222228;--mut:#999;--acc:#6c9bff;--btn:#33333a;--op:#2b3a63;--jp:#5a4020;--un:#24462f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:520px;margin:0 auto;padding:10px}
.scr{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.lab{font-size:12px;color:var(--mut);margin-bottom:4px}
#inp{width:100%;font-size:22px;border:0;border-bottom:2px solid var(--acc);background:transparent;color:var(--fg);padding:4px 0;outline:none}
#norm{font-size:13px;color:var(--mut);min-height:18px;margin-top:6px;word-break:break-all}
#conv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:8px}
#conv span{background:var(--un);border-radius:8px;padding:3px 8px;font-size:13px}
#ans{font-size:34px;font-weight:600;text-align:right;word-break:break-all;min-height:44px}
#jpr{text-align:right;font-size:14px;color:var(--acc);min-height:18px}
#hist{font-size:13px;color:var(--mut);margin-top:6px;max-height:64px;overflow-y:auto}
#hist div{cursor:pointer;padding:1px 0}
.g{display:grid;gap:6px;margin-bottom:6px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
button{border:0;border-radius:9px;background:var(--btn);color:var(--fg);font-size:15px;padding:10px 2px;cursor:pointer}
button:active{filter:brightness(.9)}
.op{background:var(--op)}.jp{background:var(--jp)}.un{background:var(--un);font-size:13px}.eq{background:var(--acc);color:#fff}
</style>
</head>
<body>
<main>
<div class="scr">
  <div class="lab">① 式入力(例:3億5千万 ÷ 2、5 km to mile、2 million + 3万)</div>
  <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="3億5千万 + 2 million">
  <div id="norm"></div>
  <div id="conv"></div>
</div>
<div class="scr">
  <div class="lab">② 答え</div>
  <div id="ans">0</div>
  <div id="jpr"></div>
  <div id="hist"></div>
</div>
<div class="g g5" id="kf"></div>
<div class="g g6" id="kj"></div>
<div class="g g6" id="ku"></div>
<div class="g g4" id="kn"></div>
</main>
<script>
const U={length:{mm:.001,cm:.01,m:1,km:1000,inch:.0254,ft:.3048,yd:.9144,mile:1609.344,"尺":10/33},
mass:{g:.001,kg:1,t:1000,oz:.028349523,lb:.45359237,"貫":3.75},
area:{m2:1,km2:1e6,ha:1e4,"坪":400/121,acre:4046.8564,ft2:.09290304},
volume:{ml:.001,L:1,m3:1000,gal:3.785411784,"合":.180391,"升":1.80391},
time:{s:1,min:60,h:3600,day:86400,week:604800},
speed:{"m/s":1,"km/h":1/3.6,mph:.44704,kn:1852/3600},
data:{B:1,KB:1e3,MB:1e6,GB:1e9,TB:1e12},
temp:{C:1,F:1,K:1}};
const AL={"℃":"C","℉":"F","°C":"C","°F":"F","㎡":"m2","l":"L"};
let deg=true;
const $=id=>document.getElementById(id);
const inp=$("inp");

function findU(u){u=AL[u]||u;for(const c in U)if(u in U[c])return[c,u];return null}
function toC(v,u){return u==="F"?(v-32)*5/9:u==="K"?v-273.15:v}
function fromC(v,u){return u==="F"?v*9/5+32:u==="K"?v+273.15:v}
function conv(v,f,t,c){return c==="temp"?fromC(toC(v,f),t):v*U[c][f]/U[c][t]}

function jp(m){
  const t=m.match(/[\d.]+|[兆億万千百]/g),V={"兆":1e12,"億":1e8,"万":1e4,"千":1e3,"百":100};
  let tot=0,sec=0,cur=null;
  for(const k of t){
    if(/[\d.]/.test(k[0]))cur=parseFloat(k);
    else if(k==="千"||k==="百"){sec+=(cur??1)*V[k];cur=null}
    else{sec+=cur??0;tot+=(sec||1)*V[k];sec=0;cur=null}
  }
  return tot+sec+(cur??0);
}
function norm(s){
  s=s.replace(/[０-９．]/g,c=>c==="．"?".":String.fromCharCode(c.charCodeAt(0)-65248));
  s=s.replace(/[\d.]*[兆億万千百](?:[\d.]|[兆億万千百])*/g,m=>"("+jp(m)+")");
  const W={trillion:"1e12",billion:"1e9",million:"1e6",thousand:"1e3"};
  s=s.replace(/([\d.]+)\s*(trillion|billion|million|thousand)/gi,(_,n,w)=>"("+n+"*"+W[w.toLowerCase()]+")");
  s=s.replace(/\b(trillion|billion|million|thousand)\b/gi,w=>"("+W[w.toLowerCase()]+")");
  return s.replace(/×/g,"*").replace(/÷/g,"/").replace(/[−―ー]/g,"-");
}
function evalExpr(s){
  let e=norm(s).replace(/\^/g,"**").replace(/π|\bpi\b/gi,"Math.PI").replace(/%/g,"/100")
    .replace(/√\(|\bsqrt\(/g,"Math.sqrt(").replace(/\blog\(/g,"Math.log10(").replace(/\bln\(/g,"Math.log(")
    .replace(/\b(sin|cos|tan)\(/g,"$1_(");
  const rest=e.replace(/Math\.(PI|sqrt|log10|log)|sin_|cos_|tan_|\d+\.?\d*e[+-]?\d+/g,"");
  if(/[A-Za-z_]/.test(rest)||!/^[\d+\-*\/().,\s\w]*$/.test(rest))throw new Error("式が正しくありません");
  const r=deg?Math.PI/180:1;
  const v=new Function("sin_","cos_","tan_",'"use strict";return ('+e+')')(
    x=>Math.sin(x*r),x=>Math.cos(x*r),x=>Math.tan(x*r));
  if(typeof v!=="number"||isNaN(v))throw new Error("計算できません");
  return v;
}
function run(text){
  const parts=text.trim().split(/\s*(?:→|->)\s*|\s+(?:to|in)\s+/i);
  const left=parts[0],tg=parts[1]?parts[1].trim():null;
  let ex=left,unit=null;
  const m=left.trim().match(/^(.*?)\s*([A-Za-z°℃℉㎡坪尺貫合升][A-Za-z0-9℃℉㎡\/°]*)$/);
  if(m){const f=findU(m[2]);if(f){unit=f;ex=m[1]||"1"}}
  const out={norm:norm(ex)};
  if(!ex.trim())throw new Error("");
  let v=evalExpr(ex);out.v=v;
  if(tg){
    if(!unit)throw new Error("元の単位がありません");
    const t=findU(tg);
    if(!t||t[0]!==unit[0])throw new Error("換算先の単位が違います");
    out.res=conv(v,unit[1],t[1],unit[0]);out.label=t[1];
    out.line=fmt(v)+" "+unit[1]+" = "+fmt(out.res)+" "+t[1];
  }else if(unit){
    out.res=v;out.label=unit[1];
    out.list=Object.keys(U[unit[0]]).filter(k=>k!==unit[1]).map(k=>[k,conv(v,unit[1],k,unit[0])]);
  }else out.res=v;
  return out;
}
function fmt(n){
  if(!isFinite(n))return String(n);
  if(n===0)return"0";
  const a=Math.abs(n);
  if(a>=1e15||a<1e-6)return n.toExponential(8).replace(/\.?0+e/,"e");
  return(+n.toPrecision(12)).toLocaleString("ja-JP",{maximumFractionDigits:10});
}
function jpRead(n){
  if(!Number.isInteger(n)||Math.abs(n)<1e4||Math.abs(n)>=1e16)return"";
  const s=n<0?"−":"";n=Math.abs(n);
  const u=["","万","億","兆"];let o="";
  for(let i=3;i>=0;i--){const c=Math.floor(n/10**(4*i))%10000;if(c)o+=c.toLocaleString()+u[i]}
  return s+o;
}
function live(){
  const t=inp.value;
  $("norm").textContent="";$("conv").innerHTML="";
  if(!t.trim())return;
  try{
    const r=run(t);
    $("norm").textContent="換算後の式: "+r.norm+(r.line?"  →  "+r.line:"  =  "+fmt(r.v));
    if(r.list)$("conv").innerHTML=r.list.map(([k,x])=>"<span>"+fmt(x)+" "+k+"</span>").join("");
  }catch(e){$("norm").textContent=e.message?"… "+e.message:""}
}
const hist=[];
function calc(){
  try{
    const r=run(inp.value);
    $("ans").textContent=fmt(r.res)+(r.label?" "+r.label:"");
    $("jpr").textContent=jpRead(r.res);
    hist.unshift(inp.value);if(hist.length>8)hist.pop();
    renderHist();
  }catch(e){$("ans").textContent="エラー";$("jpr").textContent=e.message||""}
}
function renderHist(){
  const h=$("hist");h.innerHTML="";
  hist.forEach(t=>{const d=document.createElement("div");d.textContent="↺ "+t;d.onclick=()=>{inp.value=t;live()};h.appendChild(d)});
}
function ins(t){
  const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;
  inp.setRangeText(t,s,e,"end");live();
  if(matchMedia("(hover:hover)").matches)inp.focus();
}
function ac(){inp.value="";live();$("ans").textContent="0";$("jpr").textContent=""}
function bs(){const s=inp.selectionStart,e=inp.selectionEnd;if(s!==e)inp.setRangeText("",s,e,"end");else if(s>0)inp.setRangeText("",s-1,s,"end");live()}
function mk(id,arr,cls){
  const box=$(id);
  arr.forEach(a=>{
    const b=document.createElement("button");b.textContent=a[0];
    if(cls)b.className=cls;if(a[2])b.className=a[2];
    b.onclick=()=>{
      if(a[1]==="=")calc();
      else if(a[1]==="AC")ac()
      else if(a[1]==="BS")bs()
      else if(a[1]==="DEG"){deg=!deg;b.textContent=deg?"DEG":"RAD";live()}
      else ins(a[1]);
    };
    box.appendChild(b);
  });
}
mk("kf",[["sin","sin("],["cos","cos("],["tan","tan("],["log","log("],["ln","ln("],["√","√("],["^","^"],["(","("],[")",")"],["π","π"]],"op");
mk("kj",[["百","百"],["千","千"],["万","万"],["億","億"],["兆","兆"],[" to "," to "]].map((a,i)=>i===5?[a[0],a[1],"op"]:a),"jp");
mk("ku",[["million"," million"],["billion"," billion"],["km","km"],["m","m"],["cm","cm"],["mile","mile"],["kg","kg"],["lb","lb"],["℃","℃"],["℉","℉"],["坪","坪"],["m2","m2"]],"un");
document.querySelectorAll("#kj button")[0].parentNode.querySelectorAll("button")[5].textContent="to";
mk("kn",[["AC","AC","op"],["⌫","BS","op"],["DEG","DEG","op"],["÷","÷","op"],
["7","7"],["8","8"],["9","9"],["×","×","op"],
["4","4"],["5","5"],["6","6"],["−","−","op"],
["1","1"],["2","2"],["3","3"],["+","+","op"],
["0","0"],["00","00"],[".","."],["=","=","eq"]]);
inp.addEventListener("input",live);
inp.addEventListener("keydown",e=>{if(e.key==="Enter")calc()});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==="Escape"){e.preventDefault();ac();return}
  if(document.activeElement===inp)return;
  if(/^[0-9+\-*\/.()%^]$/.test(k)){e.preventDefault();ins(k)}
  else if(k==="Enter"||k==="="){e.preventDefault();calc()}
  else if(k==="Backspace"||k==="Delete"){e.preventDefault();bs()}
});
if(matchMedia("(hover:hover)").matches)inp.focus();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
